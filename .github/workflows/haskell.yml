name: Haskell CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.10.3'
          cabal-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-9.10.3-${{ hashFiles('DCMS.cabal', 'cabal.project.freeze') }}
          restore-keys: ${{ runner.os }}-ghc-9.10.3-
      - run: cabal update
      - run: cabal build exe:DCMS
